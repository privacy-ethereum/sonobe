[package]
name = "sonobe-primitives"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ark-bn254 = { workspace = true, features = ["curve", "r1cs"] }
ark-crypto-primitives = { workspace = true, features = ["constraints", "sponge", "crh"] }
ark-ec = { workspace = true }
ark-ff = { workspace = true, features = ["asm"] }
ark-poly = { workspace = true }
ark-relations = { workspace = true }
ark-r1cs-std = { workspace = true }
ark-serialize = { workspace = true }
ark-std = { workspace = true, features = ["getrandom"] }
hashbrown = { workspace = true }
itertools = { workspace = true }
num-bigint = { workspace = true, features = ["rand"] }
num-integer = { workspace = true }
num-traits = { workspace = true }
rayon = { workspace = true }
revm = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
sha3 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
ark-grumpkin = { workspace = true, features = ["r1cs"] }
ark-pallas = { workspace = true, features = ["curve", "r1cs"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[features]
default = []
evm = ["dep:revm", "dep:serde", "dep:serde_json", "ark-std/std", "hashbrown/serde"]
parallel = [
    "ark-crypto-primitives/parallel",
    "ark-ec/parallel",
    "ark-ff/parallel",
    "ark-poly/parallel",
    "ark-relations/parallel",
    "ark-crypto-primitives/parallel",
    "ark-r1cs-std/parallel",
    "ark-serialize/parallel",
    "ark-std/parallel",
]